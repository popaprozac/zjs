<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-15 01:17 UTC", "sha": "114a20432c", "results": [{"name": "array_iterate", "engines": {"zjs": 0.004110415931791067, "qjs": 0.005190959200263023, "node": 0.018663625232875347, "bun": 0.009690749924629927}}, {"name": "closure_call", "engines": {"zjs": 0.008651708252727985, "qjs": 0.008471290580928326, "node": 0.018514750059694052, "bun": 0.009538083337247372}}, {"name": "double_loop", "engines": {"zjs": 0.010453499853610992, "qjs": 0.010774166788905859, "node": 0.01892262464389205, "bun": 0.009544541593641043}}, {"name": "fib_recursive", "engines": {"zjs": 0.14601283287629485, "qjs": 0.10847858432680368, "node": 0.028922250028699636, "bun": 0.016010708175599575}}, {"name": "int_loop", "engines": {"zjs": 0.019972666166722775, "qjs": 0.021400082856416702, "node": 0.01906395796686411, "bun": 0.011324624996632338}}, {"name": "int_loop_big", "engines": {"zjs": 0.16476679081097245, "qjs": 0.18663637479767203, "node": 0.02480704104527831, "bun": 0.030039082746952772}}, {"name": "method_call", "engines": {"zjs": 0.01033841585740447, "qjs": 0.009060000069439411, "node": 0.017521082889288664, "bun": 0.00874087493866682}}, {"name": "object_alloc", "engines": {"zjs": 0.013801415916532278, "qjs": 0.02320283278822899, "node": 0.01861745771020651, "bun": 0.009061666671186686}}, {"name": "property_mono", "engines": {"zjs": 0.013468124903738499, "qjs": 0.014212292153388262, "node": 0.01781358290463686, "bun": 0.010930166114121675}}, {"name": "property_poly", "engines": {"zjs": 0.01523300027474761, "qjs": 0.009078084025532007, "node": 0.017661958001554012, "bun": 0.008654625155031681}}, {"name": "sieve", "engines": {"zjs": 0.01456787483766675, "qjs": 0.01847787480801344, "node": 0.021304333116859198, "bun": 0.010157332755625248}}, {"name": "string_concat", "engines": {"zjs": 0.002566833049058914, "qjs": 0.002922582905739546, "node": 0.017947665881365538, "bun": 0.008856165688484907}}, {"name": "try_overhead", "engines": {"zjs": 0.006338875275105238, "qjs": 0.007073916960507631, "node": 0.018152207601815462, "bun": 0.009914250113070011}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
