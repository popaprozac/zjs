<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 04:02 UTC", "sha": "9a76844d57", "results": [{"name": "array_iterate", "engines": {"zjs": 0.004972083028405905, "qjs": 0.004667375236749649, "node": 0.018360375426709652, "bun": 0.009000999853014946}}, {"name": "closure_call", "engines": {"zjs": 0.00869029201567173, "qjs": 0.0076734996400773525, "node": 0.017272124998271465, "bun": 0.008781041949987411}}, {"name": "double_loop", "engines": {"zjs": 0.009148332756012678, "qjs": 0.009975333232432604, "node": 0.017722083255648613, "bun": 0.008485833182930946}}, {"name": "fib_recursive", "engines": {"zjs": 0.140130708925426, "qjs": 0.1062785410322249, "node": 0.02816766733303666, "bun": 0.015935332980006933}}, {"name": "int_loop", "engines": {"zjs": 0.016693125013262033, "qjs": 0.022680040914565325, "node": 0.01806191634386778, "bun": 0.011616166215389967}}, {"name": "int_loop_big", "engines": {"zjs": 0.14553466672077775, "qjs": 0.18660399969667196, "node": 0.023467041086405516, "bun": 0.028859667014330626}}, {"name": "method_call", "engines": {"zjs": 0.008597333915531635, "qjs": 0.00859045796096325, "node": 0.017268999945372343, "bun": 0.008675208315253258}}, {"name": "object_alloc", "engines": {"zjs": 0.012228999752551317, "qjs": 0.022976750042289495, "node": 0.017400124575942755, "bun": 0.009101999923586845}}, {"name": "property_mono", "engines": {"zjs": 0.01187212485820055, "qjs": 0.01434158394113183, "node": 0.017235875129699707, "bun": 0.01086654094979167}}, {"name": "property_poly", "engines": {"zjs": 0.012798083946108818, "qjs": 0.008745540864765644, "node": 0.016886292025446892, "bun": 0.009053457994014025}}, {"name": "sieve", "engines": {"zjs": 0.014253833331167698, "qjs": 0.0184025838971138, "node": 0.02046891674399376, "bun": 0.010370874777436256}}, {"name": "string_concat", "engines": {"zjs": 0.0027052080258727074, "qjs": 0.0026508751325309277, "node": 0.01618708297610283, "bun": 0.007783666718751192}}, {"name": "try_overhead", "engines": {"zjs": 0.005460250191390514, "qjs": 0.006400625221431255, "node": 0.017264916095882654, "bun": 0.008847708813846111}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
