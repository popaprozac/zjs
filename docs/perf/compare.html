<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  th.ms, th.ratio { text-align: right; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
  .legend { display: flex; gap: 1.25em; font-size: 12px; color: #555;
             margin: 0.4em 0 0.8em; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 10px; height: 10px;
                 margin-right: 4px; vertical-align: middle; border-radius: 2px; }
  .toggle { font-size: 12px; color: #666; margin-bottom: 0.6em; }
  .toggle label { margin-right: 1em; cursor: pointer; }
  svg text.bench-label { font: 12px ui-monospace, SFMono-Regular, monospace;
                          fill: #333; }
  svg text.tick { font: 11px sans-serif; fill: #777; }
  svg text.bar-val { font: 11px sans-serif; fill: #333; }
  svg line.grid { stroke: #e8e8e8; stroke-width: 1; }
  svg line.axis { stroke: #aaa; stroke-width: 1; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="card">
  <div class="legend" id="legend"></div>
  <div class="toggle">
    <label><input type="radio" name="scale" value="linear" checked> linear</label>
    <label><input type="radio" name="scale" value="log"> log scale</label>
  </div>
  <svg id="chart" width="1040" height="40" role="img" aria-label="bench comparison"></svg>
</div>

<script id="data" type="application/json">{"when": "2026-05-15 23:25 UTC", "sha": "905b4338ca", "results": [{"name": "array_iterate", "engines": {"zjs": 0.0037585413083434105, "qjs": 0.00518833426758647, "node": 0.018262417055666447, "bun": 0.009087291080504656}}, {"name": "closure_call", "engines": {"zjs": 0.007943582721054554, "qjs": 0.00754433311522007, "node": 0.016880750190466642, "bun": 0.007895000278949738}}, {"name": "double_loop", "engines": {"zjs": 0.009816874749958515, "qjs": 0.009536458179354668, "node": 0.016676167026162148, "bun": 0.008520292118191719}}, {"name": "fib_recursive", "engines": {"zjs": 0.15173708274960518, "qjs": 0.10751604195684195, "node": 0.027535583823919296, "bun": 0.01569479238241911}}, {"name": "hash_count", "engines": {"zjs": 0.005229291971772909, "qjs": 0.005504417233169079, "node": 0.017299874685704708, "bun": 0.010011458303779364}}, {"name": "int_loop", "engines": {"zjs": 0.01885583298280835, "qjs": 0.021281959023326635, "node": 0.017830209340900183, "bun": 0.012099833693355322}}, {"name": "int_loop_big", "engines": {"zjs": 0.15320716705173254, "qjs": 0.18637804174795747, "node": 0.02400316670536995, "bun": 0.0283610001206398}}, {"name": "json_roundtrip", "engines": {"zjs": 0.015188999939709902, "qjs": 0.030412542168051004, "node": 0.020878207869827747, "bun": 0.012098958250135183}}, {"name": "mandelbrot", "engines": {"zjs": 0.060473165940493345, "qjs": 0.05463691707700491, "node": 0.020333082880824804, "bun": 0.011686875019222498}}, {"name": "method_call", "engines": {"zjs": 0.009073833003640175, "qjs": 0.008659499697387218, "node": 0.016618291847407818, "bun": 0.00819966709241271}}, {"name": "nbody", "engines": {"zjs": 0.09489158308133483, "qjs": 0.08068025019019842, "node": 0.02165545802563429, "bun": 0.011489666998386383}}, {"name": "object_alloc", "engines": {"zjs": 0.015369957778602839, "qjs": 0.022986500058323145, "node": 0.017467666883021593, "bun": 0.008566457778215408}}, {"name": "property_mono", "engines": {"zjs": 0.01247712504118681, "qjs": 0.013861082959920168, "node": 0.017974624875932932, "bun": 0.011166166979819536}}, {"name": "property_poly", "engines": {"zjs": 0.013901957776397467, "qjs": 0.008897667285054922, "node": 0.01740558398887515, "bun": 0.00905141606926918}}, {"name": "quicksort", "engines": {"zjs": 0.014742250088602304, "qjs": 0.021479666233062744, "node": 0.02248816704377532, "bun": 0.011020542122423649}}, {"name": "regex_match", "engines": {"zjs": 0.0065521253272891045, "qjs": 0.12560487492009997, "node": 0.027315333019942045, "bun": 0.015720083843916655}}, {"name": "richards", "engines": {"zjs": 0.18619249993935227, "qjs": 0.16294449986889958, "node": 0.024368583224713802, "bun": 0.01736029190942645}}, {"name": "sieve", "engines": {"zjs": 0.01387020805850625, "qjs": 0.018413499929010868, "node": 0.02039770781993866, "bun": 0.009707000106573105}}, {"name": "splay", "engines": {"zjs": 0.2082895408384502, "qjs": 0.2462194999679923, "node": 0.050140040926635265, "bun": 0.021385165862739086}}, {"name": "string_concat", "engines": {"zjs": 0.002416625153273344, "qjs": 0.0029692919924855232, "node": 0.016757417004555464, "bun": 0.008925582747906446}}, {"name": "try_overhead", "engines": {"zjs": 0.00588074978441, "qjs": 0.007031166926026344, "node": 0.01917274994775653, "bun": 0.010049458127468824}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "hash_count", "int_loop", "int_loop_big", "json_roundtrip", "mandelbrot", "method_call", "nbody", "object_alloc", "property_mono", "property_poly", "quicksort", "regex_match", "richards", "sieve", "splay", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }

  // --- Grouped bar chart per benchmark -----------------------------
  // One row per bench; one bar per engine within the row, side-by-side.
  // Bars scaled to the slowest engine on that bench so even fast engines
  // are visible. Toggle linear/log via the radio above.
  const palette = {
    zjs:  '#d65a31',
    qjs:  '#3b82f6',
    node: '#10b981',
    bun:  '#a855f7',
  };
  const fallbackPalette = ['#888', '#666', '#444', '#bbb'];
  function colorFor(engine, idx) {
    return palette[engine] || fallbackPalette[idx % fallbackPalette.length];
  }

  const legend = document.getElementById('legend');
  legend.innerHTML = engines.map((e, i) => {
    const c = colorFor(e, i);
    return `<span><span class="sw" style="background:${c}"></span>${e}</span>`;
  }).join('');

  const svg = document.getElementById('chart');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(name, attrs, text) {
    const n = document.createElementNS(SVG_NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function getValues(benchName) {
    const row = data.results.find(r => r.name === benchName);
    if (!row) return {};
    return row.engines || {};
  }

  function drawChart() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const scaleMode = document.querySelector('input[name=scale]:checked').value;

    // Layout constants.
    const padL = 130, padR = 40, padT = 24, padB = 28;
    const rowH = 18 * engines.length + 12;
    const width  = 1040;
    const innerW = width - padL - padR;
    const height = padT + rowH * benches.length + padB;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    // Find the slowest reading across all benches/engines for scale.
    let maxMs = 0;
    for (const name of benches) {
      const v = getValues(name);
      for (const e of engines) {
        if (v[e] != null && v[e] * 1000 > maxMs) maxMs = v[e] * 1000;
      }
    }
    if (maxMs <= 0) return;

    const minLog = 0.1; // ms — floor for log-scale clarity
    function xFor(ms) {
      if (ms == null) return null;
      if (scaleMode === 'log') {
        const lo = Math.log10(minLog);
        const hi = Math.log10(Math.max(maxMs, minLog * 10));
        const v  = Math.log10(Math.max(ms, minLog));
        return padL + innerW * (v - lo) / (hi - lo);
      } else {
        return padL + innerW * (ms / maxMs);
      }
    }

    // Grid + ticks.
    const ticks = scaleMode === 'log'
      ? [0.1, 1, 10, 100, 1000].filter(t => t <= maxMs * 1.2)
      : (function () {
          const n = 5;
          const out = [];
          for (let i = 1; i <= n; i++) out.push(maxMs * i / n);
          return out;
        })();
    for (const t of ticks) {
      const x = xFor(t);
      if (x == null) continue;
      svg.appendChild(el('line', {
        class: 'grid',
        x1: x, x2: x, y1: padT - 4, y2: height - padB,
      }));
      svg.appendChild(el('text', {
        class: 'tick', x: x, y: height - padB + 14, 'text-anchor': 'middle',
      }, t < 10 ? t.toFixed(1) : Math.round(t).toString()));
    }
    // Axis line
    svg.appendChild(el('line', {
      class: 'axis', x1: padL, x2: width - padR,
      y1: height - padB, y2: height - padB,
    }));
    svg.appendChild(el('text', {
      class: 'tick', x: (padL + width - padR) / 2, y: height - 6,
      'text-anchor': 'middle',
    }, 'milliseconds (median wall-clock)'));

    // Rows.
    benches.forEach((name, bi) => {
      const y0 = padT + bi * rowH;
      const v  = getValues(name);
      svg.appendChild(el('text', {
        class: 'bench-label', x: padL - 8, y: y0 + rowH / 2,
        'text-anchor': 'end', 'dominant-baseline': 'middle',
      }, name));

      engines.forEach((e, ei) => {
        const ms = v[e] != null ? v[e] * 1000 : null;
        const yy = y0 + 6 + ei * 18;
        if (ms == null) return;
        const xEnd = xFor(ms);
        const x0   = xFor(scaleMode === 'log' ? Math.max(ms, minLog) * 0 + minLog : 0);
        const x    = (scaleMode === 'log') ? padL : padL;
        const w    = Math.max(1, xEnd - padL);
        svg.appendChild(el('rect', {
          x: x, y: yy, width: w, height: 14,
          fill: colorFor(e, ei), rx: 2, ry: 2,
        }));
        svg.appendChild(el('text', {
          class: 'bar-val', x: xEnd + 4, y: yy + 11,
        }, ms < 10 ? ms.toFixed(2) + 'ms' : ms.toFixed(1) + 'ms'));
      });
    });
  }

  drawChart();
  document.querySelectorAll('input[name=scale]').forEach(r =>
    r.addEventListener('change', drawChart));
</script>
</html>
