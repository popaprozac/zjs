<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-15 06:17 UTC", "sha": "d8902efe37", "results": [{"name": "array_iterate", "engines": {"zjs": 0.004402915947139263, "qjs": 0.0053580827079713345, "node": 0.023223542142659426, "bun": 0.00977162504568696}}, {"name": "closure_call", "engines": {"zjs": 0.008999417070299387, "qjs": 0.0083081666380167, "node": 0.018393959384411573, "bun": 0.009786041919142008}}, {"name": "double_loop", "engines": {"zjs": 0.010891042184084654, "qjs": 0.01056612515822053, "node": 0.01833270862698555, "bun": 0.010060582775622606}}, {"name": "fib_recursive", "engines": {"zjs": 0.15053820796310902, "qjs": 0.10836095781996846, "node": 0.02902758400887251, "bun": 0.016716834157705307}}, {"name": "int_loop", "engines": {"zjs": 0.020368416793644428, "qjs": 0.022637000307440758, "node": 0.019635791890323162, "bun": 0.012834083288908005}}, {"name": "int_loop_big", "engines": {"zjs": 0.16596641670912504, "qjs": 0.1926085827872157, "node": 0.025810042396187782, "bun": 0.030915457755327225}}, {"name": "method_call", "engines": {"zjs": 0.010686332825571299, "qjs": 0.009397624991834164, "node": 0.018693999852985144, "bun": 0.009942083153873682}}, {"name": "object_alloc", "engines": {"zjs": 0.016186040826141834, "qjs": 0.02345679234713316, "node": 0.01897529186680913, "bun": 0.00983154121786356}}, {"name": "property_mono", "engines": {"zjs": 0.015272750053554773, "qjs": 0.015726749785244465, "node": 0.018944791983813047, "bun": 0.011894875206053257}}, {"name": "property_poly", "engines": {"zjs": 0.015912541188299656, "qjs": 0.009713750332593918, "node": 0.01903562480583787, "bun": 0.010054833721369505}}, {"name": "sieve", "engines": {"zjs": 0.016003625001758337, "qjs": 0.020136000122874975, "node": 0.02225170796737075, "bun": 0.011166333220899105}}, {"name": "string_concat", "engines": {"zjs": 0.002762041985988617, "qjs": 0.003294417168945074, "node": 0.017174875363707542, "bun": 0.008765791077166796}}, {"name": "try_overhead", "engines": {"zjs": 0.0065213339403271675, "qjs": 0.007177749648690224, "node": 0.019026041962206364, "bun": 0.00953637482598424}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
