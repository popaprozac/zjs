<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 01:54 UTC", "sha": "844ec05d4b", "results": [{"name": "array_iterate", "engines": {"zjs": 0.0037564588710665703, "qjs": 0.004463875200599432, "node": 0.017921416088938713, "bun": 0.008939792402088642}}, {"name": "closure_call", "engines": {"zjs": 0.008425291161984205, "qjs": 0.007493834011256695, "node": 0.017104707658290863, "bun": 0.008771959226578474}}, {"name": "double_loop", "engines": {"zjs": 0.00996704213321209, "qjs": 0.009740457870066166, "node": 0.0170304998755455, "bun": 0.008481750264763832}}, {"name": "fib_recursive", "engines": {"zjs": 0.19865708285942674, "qjs": 0.1059542908333242, "node": 0.02748120902106166, "bun": 0.016280083917081356}}, {"name": "int_loop", "engines": {"zjs": 0.018344125244766474, "qjs": 0.021188290789723396, "node": 0.018076833803206682, "bun": 0.011168125085532665}}, {"name": "int_loop_big", "engines": {"zjs": 0.15844170888885856, "qjs": 0.1866655838675797, "node": 0.023480625357478857, "bun": 0.02914708387106657}}, {"name": "method_call", "engines": {"zjs": 0.009135750122368336, "qjs": 0.008726458996534348, "node": 0.017218208871781826, "bun": 0.008761125151067972}}, {"name": "object_alloc", "engines": {"zjs": 0.01305945822969079, "qjs": 0.02289229165762663, "node": 0.016747291199862957, "bun": 0.008368667215108871}}, {"name": "property_mono", "engines": {"zjs": 0.012597958091646433, "qjs": 0.013688750099390745, "node": 0.017541832756251097, "bun": 0.010920042172074318}}, {"name": "property_poly", "engines": {"zjs": 0.016007500234991312, "qjs": 0.008686250075697899, "node": 0.017558207735419273, "bun": 0.0090489168651402}}, {"name": "sieve", "engines": {"zjs": 0.014653665944933891, "qjs": 0.0182483340613544, "node": 0.020272458903491497, "bun": 0.010412000119686127}}, {"name": "string_concat", "engines": {"zjs": 0.002313250210136175, "qjs": 0.0028509581461548805, "node": 0.016149125061929226, "bun": 0.007753999903798103}}, {"name": "try_overhead", "engines": {"zjs": 0.005698458757251501, "qjs": 0.00656204205006361, "node": 0.017171416897326708, "bun": 0.008437959011644125}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
