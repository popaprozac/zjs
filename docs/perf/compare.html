<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 02:34 UTC", "sha": "ec227fa806", "results": [{"name": "array_iterate", "engines": {"zjs": 0.003559208009392023, "qjs": 0.004668958019465208, "node": 0.018750749994069338, "bun": 0.008981000166386366}}, {"name": "closure_call", "engines": {"zjs": 0.008638041093945503, "qjs": 0.008115791715681553, "node": 0.016791624948382378, "bun": 0.008167958818376064}}, {"name": "double_loop", "engines": {"zjs": 0.009872082620859146, "qjs": 0.009630292188376188, "node": 0.017295541241765022, "bun": 0.008237041998654604}}, {"name": "fib_recursive", "engines": {"zjs": 0.19849487487226725, "qjs": 0.10758095839992166, "node": 0.028144750278443098, "bun": 0.015562541782855988}}, {"name": "int_loop", "engines": {"zjs": 0.018088291864842176, "qjs": 0.02094683377072215, "node": 0.017921291291713715, "bun": 0.010803958401083946}}, {"name": "int_loop_big", "engines": {"zjs": 0.1609223340637982, "qjs": 0.18722058320418, "node": 0.02377299964427948, "bun": 0.029075208120048046}}, {"name": "method_call", "engines": {"zjs": 0.010046666953712702, "qjs": 0.008475542068481445, "node": 0.017140583135187626, "bun": 0.008453959133476019}}, {"name": "object_alloc", "engines": {"zjs": 0.012353917118161917, "qjs": 0.022341332864016294, "node": 0.01796066714450717, "bun": 0.008889834396541119}}, {"name": "property_mono", "engines": {"zjs": 0.013221124652773142, "qjs": 0.014045499730855227, "node": 0.017738834023475647, "bun": 0.010398666840046644}}, {"name": "property_poly", "engines": {"zjs": 0.015769750345498323, "qjs": 0.009071999695152044, "node": 0.017336833756417036, "bun": 0.009256333112716675}}, {"name": "sieve", "engines": {"zjs": 0.015212540980428457, "qjs": 0.01900808373466134, "node": 0.020277292001992464, "bun": 0.01027987478300929}}, {"name": "string_concat", "engines": {"zjs": 0.0022096671164035797, "qjs": 0.002915499731898308, "node": 0.01650712499395013, "bun": 0.0074382503516972065}}, {"name": "try_overhead", "engines": {"zjs": 0.005810166243463755, "qjs": 0.006481541320681572, "node": 0.01759195839986205, "bun": 0.008917166851460934}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
