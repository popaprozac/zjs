<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 01:37 UTC", "sha": "d2704a6985", "results": [{"name": "array_iterate", "engines": {"zjs": 0.0042329998686909676, "qjs": 0.004758791998028755, "node": 0.01919904164969921, "bun": 0.008991374634206295}}, {"name": "closure_call", "engines": {"zjs": 0.012039625085890293, "qjs": 0.007490915711969137, "node": 0.017361999955028296, "bun": 0.008984541986137629}}, {"name": "double_loop", "engines": {"zjs": 0.013403625227510929, "qjs": 0.009614000096917152, "node": 0.01699633290991187, "bun": 0.008247500285506248}}, {"name": "fib_recursive", "engines": {"zjs": 0.2720515001565218, "qjs": 0.10691237496212125, "node": 0.027543208096176386, "bun": 0.015705541241914034}}, {"name": "int_loop", "engines": {"zjs": 0.025504374876618385, "qjs": 0.021218083333224058, "node": 0.018227375112473965, "bun": 0.011288166977465153}}, {"name": "int_loop_big", "engines": {"zjs": 0.22485070815309882, "qjs": 0.18361379113048315, "node": 0.02319875033572316, "bun": 0.028763458132743835}}, {"name": "method_call", "engines": {"zjs": 0.013491790741682053, "qjs": 0.00861829100176692, "node": 0.017393166664987803, "bun": 0.008485374972224236}}, {"name": "object_alloc", "engines": {"zjs": 0.014218333177268505, "qjs": 0.022365666925907135, "node": 0.017282749991863966, "bun": 0.00819570804014802}}, {"name": "property_mono", "engines": {"zjs": 0.01733279088512063, "qjs": 0.014139082748442888, "node": 0.017936374992132187, "bun": 0.011414124630391598}}, {"name": "property_poly", "engines": {"zjs": 0.01839279104024172, "qjs": 0.008719416800886393, "node": 0.017413457855582237, "bun": 0.009068457875400782}}, {"name": "sieve", "engines": {"zjs": 0.02036983333528042, "qjs": 0.018216333352029324, "node": 0.02078824955970049, "bun": 0.0102484580129385}}, {"name": "string_concat", "engines": {"zjs": 0.00241183303296566, "qjs": 0.002682874910533428, "node": 0.016775874886661768, "bun": 0.00795325031504035}}, {"name": "try_overhead", "engines": {"zjs": 0.0071000829339027405, "qjs": 0.006691958289593458, "node": 0.017534167040139437, "bun": 0.008569541852921247}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
