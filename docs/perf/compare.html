<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-15 06:32 UTC", "sha": "014c66c679", "results": [{"name": "array_iterate", "engines": {"zjs": 0.004355332814157009, "qjs": 0.005431292112916708, "node": 0.01879791682586074, "bun": 0.009619957767426968}}, {"name": "closure_call", "engines": {"zjs": 0.009481333196163177, "qjs": 0.00790016632527113, "node": 0.01738074980676174, "bun": 0.009145624935626984}}, {"name": "double_loop", "engines": {"zjs": 0.010537541937083006, "qjs": 0.010272332932800055, "node": 0.01837487518787384, "bun": 0.009890541899949312}}, {"name": "fib_recursive", "engines": {"zjs": 0.14565558265894651, "qjs": 0.10722154192626476, "node": 0.030293999705463648, "bun": 0.017442541662603617}}, {"name": "int_loop", "engines": {"zjs": 0.018374667037278414, "qjs": 0.021734375040978193, "node": 0.020214291755110025, "bun": 0.013009708374738693}}, {"name": "int_loop_big", "engines": {"zjs": 0.1592227080836892, "qjs": 0.1922041247598827, "node": 0.025919375009834766, "bun": 0.030420541763305664}}, {"name": "method_call", "engines": {"zjs": 0.010216250084340572, "qjs": 0.008969957940280437, "node": 0.01774066686630249, "bun": 0.010184458456933498}}, {"name": "object_alloc", "engines": {"zjs": 0.015104500111192465, "qjs": 0.02512416709214449, "node": 0.019541624933481216, "bun": 0.009637249633669853}}, {"name": "property_mono", "engines": {"zjs": 0.013769583776593208, "qjs": 0.015964457765221596, "node": 0.019886250142008066, "bun": 0.012944791931658983}}, {"name": "property_poly", "engines": {"zjs": 0.01581675000488758, "qjs": 0.009917167015373707, "node": 0.019494165666401386, "bun": 0.01112870778888464}}, {"name": "sieve", "engines": {"zjs": 0.015332750044763088, "qjs": 0.020245958119630814, "node": 0.0241632922552526, "bun": 0.011554458178579807}}, {"name": "string_concat", "engines": {"zjs": 0.002586083021014929, "qjs": 0.0032821251079440117, "node": 0.016697957646101713, "bun": 0.008016834035515785}}, {"name": "try_overhead", "engines": {"zjs": 0.006521583069115877, "qjs": 0.0068831248208880424, "node": 0.01870554219931364, "bun": 0.010419208090752363}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
