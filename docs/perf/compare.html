<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 22:35 UTC", "sha": "16e3f0ef03", "results": [{"name": "array_iterate", "engines": {"zjs": 0.004772332962602377, "qjs": 0.005205791909247637, "node": 0.01865104166790843, "bun": 0.009021209087222815}}, {"name": "closure_call", "engines": {"zjs": 0.00939637515693903, "qjs": 0.007827875204384327, "node": 0.017455459106713533, "bun": 0.008637666702270508}}, {"name": "double_loop", "engines": {"zjs": 0.010341417044401169, "qjs": 0.009625083301216364, "node": 0.017260458786040545, "bun": 0.008846541866660118}}, {"name": "fib_recursive", "engines": {"zjs": 0.14669108297675848, "qjs": 0.10625941725447774, "node": 0.029186250176280737, "bun": 0.017087750136852264}}, {"name": "int_loop", "engines": {"zjs": 0.01902391714975238, "qjs": 0.021999916061758995, "node": 0.018991332966834307, "bun": 0.011744417250156403}}, {"name": "int_loop_big", "engines": {"zjs": 0.1599510838277638, "qjs": 0.1877010832540691, "node": 0.023772084154188633, "bun": 0.029189582914114}}, {"name": "method_call", "engines": {"zjs": 0.009856415912508965, "qjs": 0.009045500308275223, "node": 0.01766991661861539, "bun": 0.008786207996308804}}, {"name": "object_alloc", "engines": {"zjs": 0.013664458878338337, "qjs": 0.02296254225075245, "node": 0.01768050016835332, "bun": 0.00854595797136426}}, {"name": "property_mono", "engines": {"zjs": 0.014167791232466698, "qjs": 0.014171625021845102, "node": 0.018035707995295525, "bun": 0.010907916817814112}}, {"name": "property_poly", "engines": {"zjs": 0.015112458262592554, "qjs": 0.009444457944482565, "node": 0.017857541795819998, "bun": 0.009305832907557487}}, {"name": "sieve", "engines": {"zjs": 0.01585762482136488, "qjs": 0.018856375012546778, "node": 0.02165408292785287, "bun": 0.010859542060643435}}, {"name": "string_concat", "engines": {"zjs": 0.002719499636441469, "qjs": 0.003184583969414234, "node": 0.016073583159595728, "bun": 0.008101415820419788}}, {"name": "try_overhead", "engines": {"zjs": 0.005940000060945749, "qjs": 0.006968459114432335, "node": 0.01808824995532632, "bun": 0.008474375121295452}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
