<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zjs vs other engines</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #666; margin-bottom: 1.5em; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px;
           padding: 1em 1.25em; margin-bottom: 1.25em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.bench { font-family: ui-monospace, SFMono-Regular, monospace; }
  td.ms { text-align: right; font-variant-numeric: tabular-nums; }
  td.ratio { text-align: right; font-variant-numeric: tabular-nums; color: #888; }
</style>

<h1>zjs vs other engines</h1>
<p class="sub">Snapshot of <span id="when"></span> @ <code id="sha"></code>.
Median wall-clock per script (lower is better). Includes engine startup —
JIT-heavy engines have small absolute numbers because the iterations
in our scripts are too short to repay JIT cost.</p>

<div class="card">
  <table id="compare-table">
    <thead><tr id="thead-row"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script id="data" type="application/json">{"when": "2026-05-14 14:54 UTC", "sha": "6768245073", "results": [{"name": "array_iterate", "engines": {"zjs": 0.0034492500126361847, "qjs": 0.0043920413590967655, "node": 0.018157583195716143, "bun": 0.008667707908898592}}, {"name": "closure_call", "engines": {"zjs": 0.008066083770245314, "qjs": 0.007322167046368122, "node": 0.016656958032399416, "bun": 0.00823187455534935}}, {"name": "double_loop", "engines": {"zjs": 0.009333208203315735, "qjs": 0.01028124988079071, "node": 0.017200459260493517, "bun": 0.008114375174045563}}, {"name": "fib_recursive", "engines": {"zjs": 0.14328004186972976, "qjs": 0.10498329112306237, "node": 0.027912749908864498, "bun": 0.015410917345434427}}, {"name": "int_loop", "engines": {"zjs": 0.01734087523072958, "qjs": 0.021001999732106924, "node": 0.01772416615858674, "bun": 0.011088541243225336}}, {"name": "int_loop_big", "engines": {"zjs": 0.14999412512406707, "qjs": 0.18595629138872027, "node": 0.02340104104951024, "bun": 0.028551040682941675}}, {"name": "method_call", "engines": {"zjs": 0.009195791091769934, "qjs": 0.008600583299994469, "node": 0.016359041910618544, "bun": 0.00829849997535348}}, {"name": "object_alloc", "engines": {"zjs": 0.012197542004287243, "qjs": 0.022291791159659624, "node": 0.01708112470805645, "bun": 0.00830791611224413}}, {"name": "property_mono", "engines": {"zjs": 0.012297834269702435, "qjs": 0.014082166366279125, "node": 0.01747062522917986, "bun": 0.010581666138023138}}, {"name": "property_poly", "engines": {"zjs": 0.012832167092710733, "qjs": 0.008689749985933304, "node": 0.01716933399438858, "bun": 0.00874916696920991}}, {"name": "sieve", "engines": {"zjs": 0.01447424991056323, "qjs": 0.018110624980181456, "node": 0.02001666696742177, "bun": 0.010240667033940554}}, {"name": "string_concat", "engines": {"zjs": 0.002170874737203121, "qjs": 0.002657750155776739, "node": 0.016200958751142025, "bun": 0.007111874874681234}}, {"name": "try_overhead", "engines": {"zjs": 0.005235457792878151, "qjs": 0.006472417153418064, "node": 0.0173958339728415, "bun": 0.008172291330993176}}]}</script>
<script id="benches" type="application/json">["array_iterate", "closure_call", "double_loop", "fib_recursive", "int_loop", "int_loop_big", "method_call", "object_alloc", "property_mono", "property_poly", "sieve", "string_concat", "try_overhead"]</script>
<script id="engines" type="application/json">["zjs", "qjs", "node", "bun"]</script>
<script>
  const data    = JSON.parse(document.getElementById('data').textContent);
  const benches = JSON.parse(document.getElementById('benches').textContent);
  const engines = JSON.parse(document.getElementById('engines').textContent);

  document.getElementById('when').textContent = data.when || '';
  document.getElementById('sha').textContent  = data.sha  || '';

  const thead = document.getElementById('thead-row');
  thead.innerHTML = '<th>Benchmark</th>' + engines.map(e => `<th class="ms">${e} ms</th>`).join('') +
    engines.filter(e => e !== 'zjs').map(e => `<th class="ratio">zjs / ${e}</th>`).join('');

  const tbody = document.querySelector('#compare-table tbody');
  for (const name of benches) {
    const row = data.results.find(r => r.name === name) || {name, engines: {}};
    let html = `<td class="bench">${name}</td>`;
    for (const e of engines) {
      const v = row.engines[e];
      html += `<td class="ms">${v == null ? '—' : (v * 1000).toFixed(2)}</td>`;
    }
    const zjs_v = row.engines["zjs"];
    for (const e of engines.filter(x => x !== 'zjs')) {
      const o = row.engines[e];
      if (zjs_v && o) {
        const ratio = zjs_v / o;
        html += `<td class="ratio">${ratio.toFixed(1)}×</td>`;
      } else {
        html += `<td class="ratio">—</td>`;
      }
    }
    const tr = document.createElement('tr');
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
</script>
</html>
